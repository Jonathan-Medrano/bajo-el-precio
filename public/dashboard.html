<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis alertas — Bajó el Precio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='9' fill='%23e64c1e'/><polyline points='7,11 14,17 21,13 28,24' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #e64c1e; --brand-dark: #c03d18; --brand-bg: #fff3ef;
      --text: #111827; --text-soft: #6b7280; --text-xsoft: #9ca3af;
      --bg: #f9fafb; --surface: #ffffff; --border: #e5e7eb; --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
    a { color: inherit; text-decoration: none; }

    .nav { background: var(--surface); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; max-width: 960px; margin: 0 auto; padding: 0 20px; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .nav-back { font-size: 14px; color: var(--text-soft); padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); }
    .nav-back:hover { background: var(--bg); }

    .page { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    .page-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
    .page-sub { font-size: 15px; color: var(--text-soft); margin-bottom: 32px; }

    /* Login */
    #login-section { text-align: center; padding: 64px 20px; }
    .login-icon { font-size: 52px; margin-bottom: 16px; }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .login-sub { font-size: 15px; color: var(--text-soft); margin-bottom: 28px; max-width: 380px; margin-left: auto; margin-right: auto; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 380px; margin: 0 auto; }
    .login-label { font-size: 13px; font-weight: 600; color: var(--text-soft); margin-bottom: 8px; text-align: left; }
    .login-input { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; margin-bottom: 12px; transition: border-color 80ms, box-shadow 80ms; }
    .login-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(230,76,30,.12); }
    .login-btn { width: 100%; padding: 13px; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background 80ms, transform 80ms; }
    .login-btn:hover { background: var(--brand-dark); }
    .login-btn:active { transform: scale(.97); }
    .login-help { font-size: 12px; color: var(--text-xsoft); margin-top: 10px; text-align: left; }
    .login-help a { color: var(--brand); }
    #login-error { font-size: 13px; color: #dc2626; margin-top: 8px; min-height: 18px; }

    /* Alerts list */
    #alerts-section { display: none; }
    .alert-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px; transition: box-shadow 80ms, border-color 80ms; }
    .alert-card:hover { box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.05); }
    .alert-info { flex: 1; min-width: 0; }
    .alert-title { font-size: 14px; font-weight: 600; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .alert-prices { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
    .alert-price-item { font-size: 12px; color: var(--text-soft); }
    .alert-price-item strong { color: var(--text); font-weight: 600; }
    .alert-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .badge-good { background: #ecfdf5; color: #065f46; }
    .badge-bad { background: #fef2f2; color: #991b1b; }
    .badge-wait { background: #f3f4f6; color: #4b5563; }
    .alert-actions { display: flex; gap: 8px; align-items: center; }
    .btn-sm { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); transition: background 80ms, transform 80ms; }
    .btn-sm:active { transform: scale(.96); }
    .btn-sm:hover { background: var(--border); }
    .btn-sm.danger { color: #dc2626; border-color: #fca5a5; }
    .btn-sm.danger:hover { background: #fef2f2; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-soft); }
    .empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-go { display: inline-block; margin-top: 20px; padding: 12px 24px; background: var(--brand); color: #fff; border-radius: 10px; font-weight: 700; font-size: 14px; }

    .plan-banner { background: var(--brand-bg); border: 1px solid rgba(230,76,30,.2); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .plan-badge { background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
    .plan-info { flex: 1; font-size: 13px; color: var(--text-soft); }
    .plan-info strong { color: var(--text); }
    .upgrade-link { font-size: 13px; font-weight: 600; color: var(--brand); }

    .logout-btn { font-size: 13px; color: var(--text-soft); background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0; }
    .logout-btn:hover { color: var(--text); }

    #loading { display: none; }

    /* skeleton */
    @keyframes shimmer { from { background-position: -400px 0 } to { background-position: 400px 0 } }
    .skel { border-radius: 6px; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 800px 100%; animation: shimmer 1.4s infinite; }
    .skel-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px; }
    .skel-text-block { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .skel-line { height: 12px; border-radius: 4px; }
    .skel-line.w70 { width: 70%; }
    .skel-line.w40 { width: 40%; height: 10px; }
    .skel-pill { width: 90px; height: 26px; border-radius: 999px; }
    .skel-btn { width: 70px; height: 30px; border-radius: 8px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <svg viewBox="0 0 36 36" width="24" height="24" aria-hidden="true">
        <rect width="36" height="36" rx="9" fill="#e64c1e"/>
        <polyline points="7,11 14,17 21,13 28,24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Bajó el Precio
    </a>
    <a class="nav-back" href="/">← Inicio</a>
  </div>
</nav>

<!-- Login -->
<section id="login-section">
  <div class="login-icon">🔔</div>
  <div class="login-title">Tus alertas de precio</div>
  <p class="login-sub">Ingresá tu Chat ID de Telegram para ver y gestionar tus alertas activas.</p>
  <div class="login-box">
    <div class="login-label">Chat ID de Telegram</div>
    <input class="login-input" id="chatid-input" type="text" placeholder="ej: 123456789" />
    <button class="login-btn" id="login-btn">Ver mis alertas</button>
    <p class="login-help">
      No sabés tu ID? Mandá <strong>/start</strong> a <a href="https://t.me/bajoelprecio_bot" target="_blank">@bajoelprecio_bot</a> y él te lo dice.
    </p>
    <p id="login-error"></p>
  </div>
</section>

<!-- Alerts dashboard -->
<section id="alerts-section">
  <div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h1 class="page-title">Mis alertas</h1>
      <button class="logout-btn" id="logout-btn">Cambiar cuenta</button>
    </div>
    <p class="page-sub" id="dash-sub">Productos que estás siguiendo.</p>

    <div id="plan-banner-wrap"></div>
    <div id="loading">
      <div class="skel-row"><div class="skel-text-block"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div><div class="skel skel-pill"></div><div class="skel skel-btn"></div></div>
      <div class="skel-row"><div class="skel-text-block"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div><div class="skel skel-pill"></div><div class="skel skel-btn"></div></div>
      <div class="skel-row"><div class="skel-text-block"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div><div class="skel skel-pill"></div><div class="skel skel-btn"></div></div>
    </div>
    <div id="alerts-list"></div>
  </div>
</section>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => n == null ? '—' : '$' + Number(n).toLocaleString('es-AR');
  const STORAGE_KEY = 'bep_chatid';

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getSavedId() { return localStorage.getItem(STORAGE_KEY) || ''; }
  function saveId(id) { localStorage.setItem(STORAGE_KEY, id); }
  function clearId() { localStorage.removeItem(STORAGE_KEY); }

  function showLogin() {
    $('login-section').style.display = '';
    $('alerts-section').style.display = 'none';
  }

  function showDash() {
    $('login-section').style.display = 'none';
    $('alerts-section').style.display = '';
  }

  async function loadAlerts(chatId) {
    showDash();
    $('loading').style.display = 'block';
    $('alerts-list').innerHTML = '';

    try {
      const [alertsRes, planRes] = await Promise.all([
        fetch(`/api/alerts/${encodeURIComponent(chatId)}`),
        fetch(`/api/plan/${encodeURIComponent(chatId)}`)
      ]);
      const alerts = await alertsRes.json();
      const plan = await planRes.json();

      $('loading').style.display = 'none';

      // Plan banner
      renderPlanBanner(plan, chatId);

      if (!Array.isArray(alerts) || !alerts.length) {
        $('alerts-list').innerHTML = `
          <div class="empty-state">
            <h3>No tenés alertas activas</h3>
            <p>Buscá un producto en la página principal y activá la alerta de precio.</p>
            <a class="empty-go" href="/">Ir al inicio</a>
          </div>`;
        return;
      }

      $('dash-sub').textContent = `${alerts.length} producto${alerts.length !== 1 ? 's' : ''} en seguimiento.`;

      $('alerts-list').innerHTML = alerts.map(a => {
        const current = a.currentPrice;
        const target = a.targetPrice;
        let badge = '', badgeClass = 'badge-wait';
        if (current != null && target != null) {
          if (current <= target) { badge = '¡Bajó al precio objetivo!'; badgeClass = 'badge-good'; }
          else { badge = `Falta ${fmt(current - target)}`; badgeClass = 'badge-bad'; }
        } else if (current == null) {
          badge = 'Sin precio aún';
        }

        return `<div class="alert-card" id="card-${esc(a.productId)}">
          <div class="alert-info">
            <div class="alert-title"><a href="/p/${esc(a.productId)}" target="_blank">${esc(a.title)}</a></div>
            <div class="alert-prices">
              <div class="alert-price-item">Precio actual: <strong>${fmt(current)}</strong></div>
              ${target != null ? `<div class="alert-price-item">Objetivo: <strong>${fmt(target)}</strong></div>` : ''}
            </div>
          </div>
          ${badge ? `<div class="alert-badge ${badgeClass}">${esc(badge)}</div>` : ''}
          <div class="alert-actions">
            <a class="btn-sm" href="/p/${esc(a.productId)}" target="_blank">Ver gráfico</a>
            <button class="btn-sm danger" onclick="deleteAlert('${esc(chatId)}', '${esc(a.productId)}')">Borrar</button>
          </div>
        </div>`;
      }).join('');

    } catch {
      $('loading').style.display = 'none';
      $('alerts-list').innerHTML = '<div class="empty-state"><h3>Error al cargar</h3><p>Verificá tu Chat ID e intentá de nuevo.</p></div>';
    }
  }

  function renderPlanBanner(plan, chatId) {
    const wrap = $('plan-banner-wrap');
    if (!plan) { wrap.innerHTML = ''; return; }
    const isPremium = plan.plan === 'premium';
    const used = plan.used ?? 0;
    const limit = plan.limit ?? 3;
    wrap.innerHTML = `<div class="plan-banner">
      <span class="plan-badge">${isPremium ? 'Premium' : 'Free'}</span>
      <div class="plan-info">
        ${isPremium
          ? `Plan <strong>Premium</strong> activo.`
          : `Plan <strong>Free</strong>: ${used}/${limit} alertas usadas.`}
      </div>
      ${!isPremium ? `<a class="upgrade-link" href="https://t.me/bajoelprecio_bot" target="_blank">Subir a Premium →</a>` : ''}
    </div>`;
  }

  async function deleteAlert(chatId, productId) {
    if (!confirm('¿Borrar esta alerta?')) return;
    try {
      await fetch('/api/alerts', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatId, productId })
      });
      const card = $('card-' + productId);
      if (card) card.remove();
      const remaining = document.querySelectorAll('.alert-card').length;
      if (!remaining) loadAlerts(chatId);
    } catch {
      alert('Error al borrar la alerta.');
    }
  }
  window.deleteAlert = deleteAlert;

  // ── Login ────────────────────────────────────
  $('login-btn').addEventListener('click', async () => {
    const id = $('chatid-input').value.trim();
    if (!id || !/^\d+$/.test(id)) { $('login-error').textContent = 'Ingresá un Chat ID válido (solo números).'; return; }
    $('login-error').textContent = '';
    saveId(id);
    await loadAlerts(id);
  });

  $('chatid-input').addEventListener('keydown', e => e.key === 'Enter' && $('login-btn').click());

  $('logout-btn').addEventListener('click', () => { clearId(); showLogin(); });

  // ── Init ─────────────────────────────────────
  const saved = getSavedId();
  if (saved) {
    loadAlerts(saved);
  } else {
    showLogin();
  }
</script>
</body>
</html>
